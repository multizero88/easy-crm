<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Активация CRM системы</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0a0f;
            --panel-bg: rgba(20, 18, 30, 0.45);
            --border-color: rgba(255, 255, 255, 0.08);
            --primary-color: #7c4dff;
            --primary-glow: rgba(124, 77, 255, 0.4);
            --text-primary: #ffffff;
            --text-secondary: #a3a0ae;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Abstract glowing background blobs */
        .glow-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 1;
            opacity: 0.5;
        }
        .blob-1 {
            width: 400px;
            height: 400px;
            background: var(--primary-color);
            top: -100px;
            left: -100px;
        }
        .blob-2 {
            width: 500px;
            height: 500px;
            background: #00e5ff;
            bottom: -150px;
            right: -150px;
            opacity: 0.3;
        }

        .activation-card {
            width: 100%;
            max-width: 460px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 24px 64px rgba(0,0,0,0.6);
            z-index: 10;
            text-align: center;
        }

        .logo-area {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            background: rgba(124, 77, 255, 0.15);
            border: 1px solid rgba(124, 77, 255, 0.3);
            border-radius: 18px;
            margin-bottom: 24px;
            color: var(--primary-color);
            box-shadow: 0 8px 24px var(--primary-glow);
        }

        h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        p {
            color: var(--text-secondary);
            font-size: 0.92rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .lic-info-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            font-family: monospace;
            font-size: 0.82rem;
            color: var(--text-secondary);
            margin-bottom: 24px;
            text-align: left;
            word-break: break-all;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary-color), #651fff);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(124, 77, 255, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(124, 77, 255, 0.5);
        }

        .btn:active {
            transform: translateY(0);
        }

        .error-message {
            margin-top: 15px;
            color: #ff1744;
            font-size: 0.85rem;
            line-height: 1.4;
            display: none;
        }
    </style>
</head>
<body>
    <div class="glow-blob blob-1"></div>
    <div class="glow-blob blob-2"></div>

    <div class="activation-card">
        <div class="logo-area">
            <svg viewBox="0 0 24 24" width="32" height="32" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </div>
        <h2>Активация CRM</h2>
        <p>Для запуска системы требуется действительный файл лицензии на вашем компьютере.</p>
        
        <div class="lic-info-box">
            Путь к файлу: C:\easy_crm.lic
        </div>

        <form id="activation-form">
            <div class="form-group">
                <label for="license-key">Лицензионный ключ</label>
                <input type="text" id="license-key" placeholder="Введите ключ активации" required autocomplete="off">
            </div>
            <button type="submit" class="btn" id="btn-submit">Активировать систему</button>
            <div class="error-message" id="error-box"></div>
        </form>
    </div>

    <script>
        document.getElementById("activation-form").addEventListener("submit", function(e) {
            e.preventDefault();
            const key = document.getElementById("license-key").value.trim();
            const errorBox = document.getElementById("error-box");
            const submitBtn = document.getElementById("btn-submit");

            errorBox.style.display = "none";
            submitBtn.disabled = true;
            submitBtn.innerText = "Проверка...";

            fetch("/api/license/activate", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ key: key })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert("CRM система успешно активирована!");
                    window.location.reload();
                } else {
                    errorBox.innerText = data.message || "Неверный ключ активации.";
                    errorBox.style.display = "block";
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Активировать систему";
                }
            })
            .catch(err => {
                errorBox.innerText = "Сетевая ошибка при активации.";
                errorBox.style.display = "block";
                submitBtn.disabled = false;
                submitBtn.innerText = "Активировать систему";
            });
        });
    </script>
</body>
</html>
